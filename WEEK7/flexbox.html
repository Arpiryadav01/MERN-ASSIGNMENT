<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flexbox Navbar</title>
	<style>
		:root {
			--color-page: #f4f7fb;
			--color-surface: #ffffff;
			--color-text: #17233b;
			--color-muted: #52617a;
			--color-accent: #3859d7;
			--color-banner: #e8edff;
			--space-navbar-x: 32px;
			--space-navbar-y: 16px;
			--space-items: 28px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			background: var(--color-page);
			color: var(--color-text);
			font-family: "Segoe UI", Arial, sans-serif;
		}

		.navbar {
			display: flex;
			min-height: 76px;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			padding: var(--space-navbar-y) var(--space-navbar-x);
			background: var(--color-surface);
			box-shadow: 0 4px 18px rgb(23 35 59 / 8%);
		}

		.logo {
			color: var(--color-accent);
			font-size: 1.4rem;
			font-weight: 800;
			letter-spacing: -0.04em;
			text-decoration: none;
			white-space: nowrap;
		}

		.navbar-right {
			display: flex;
			align-items: center;
			gap: var(--space-items);
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: var(--space-items);
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.nav-links a {
			color: var(--color-muted);
			font-size: 0.95rem;
			font-weight: 600;
			text-decoration: none;
		}

		.nav-links a:hover,
		.nav-links a:focus-visible {
			color: var(--color-accent);
		}

		.nav-button {
			padding: 11px 18px;
			border: 0;
			border-radius: 8px;
			background: var(--color-accent);
			color: var(--color-surface);
			font: inherit;
			font-weight: 700;
			text-decoration: none;
			white-space: nowrap;
		}

		.nav-button:hover,
		.nav-button:focus-visible {
			background: #2948bd;
		}

		.banner {
			display: flex;
			min-height: 340px;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 40px 24px;
			background: var(--color-banner);
			text-align: center;
		}

		.banner h1 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 5vw, 3.25rem);
		}

		.banner p {
			max-width: 560px;
			margin: 0;
			color: var(--color-muted);
			font-size: 1.1rem;
		}

		.course-section {
			padding: 40px var(--space-navbar-x);
		}

		.course-section h2 {
			margin: 0 0 20px;
			text-align: center;
		}

		.course-cards {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			max-width: 1100px;
			margin: 0 auto;
		}

		.course-card {
			flex: 1 1 200px;
			min-width: 0;
			padding: 24px;
			border: 1px solid #e1e6f0;
			border-radius: 12px;
			background: var(--color-surface);
			box-shadow: 0 6px 20px rgb(23 35 59 / 6%);
		}

		.course-card h3 {
			margin: 0 0 8px;
			color: var(--color-accent);
		}

		.course-card p {
			margin: 0;
			color: var(--color-muted);
		}

		@media (max-width: 640px) {
			.navbar {
				flex-wrap: wrap;
				padding: 16px 20px;
			}

			.navbar-right {
				width: 100%;
				justify-content: space-between;
				gap: 16px;
			}

			.nav-links {
				flex-wrap: wrap;
				gap: 12px 18px;
			}

			.course-section {
				padding: 32px 20px;
			}
		}
	</style>
</head>
<body>
	<nav class="navbar" aria-label="Main navigation">
		<a class="logo" href="#home">DevPath</a>
		<div class="navbar-right">
			<ul class="nav-links">
				<li><a href="#home">Home</a></li>
				<li><a href="#courses">Courses</a></li>
			
				<li><a href="#contact">Contact</a></li>
			</ul>
			<a class="nav-button" href="#sign Up">Sign Up</a>
		</div>
	</nav>
		<main class="banner">
			<h1>Learn Web Development</h1>
			<p>Start from zero. build real projects.</p>
                 		<a class="banner-button" href="#courses">Get Started</a>
	</header>
		</main>
		<section class="course-section" aria-labelledby="courses-title">
			
			<div class="course-cards">
				<article class="course-card">
					<h3>HTML </h3>
					<p>Build Structure.</p>
				</article>
                <article class="course-card">
					<h3>CSS </h3>
					<p>Make is beautiful.</p>
				</article>
                
				<article class="course-card">
					<h3>JavaScript</h3>
					<p>Make it smart.</p>
				</article>
				<article class="course-card">
					<h3>Git</h3>
					<p>Save your work.</p>
				</article>
			</div>
		</section>
</body>
</html>
