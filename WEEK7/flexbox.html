<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flexbox Navbar</title>
	<style>
		:root {
			--color-page: #f4f7fb;
			--color-surface: #ffffff;
			--color-text: #17233b;
			--color-muted: #52617a;
			--color-accent: #3859d7;
			--space-navbar-x: 32px;
			--space-navbar-y: 16px;
			--space-items: 28px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			background: var(--color-page);
			color: var(--color-text);
			font-family: "Segoe UI", Arial, sans-serif;
		}

		.navbar {
			display: flex;
			min-height: 76px;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			padding: var(--space-navbar-y) var(--space-navbar-x);
			background: var(--color-surface);
			box-shadow: 0 4px 18px rgb(23 35 59 / 8%);
		}

		.logo {
			color: var(--color-accent);
			font-size: 1.4rem;
			font-weight: 800;
			letter-spacing: -0.04em;
			text-decoration: none;
			white-space: nowrap;
		}

		.navbar-right {
			display: flex;
			align-items: center;
			gap: var(--space-items);
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: var(--space-items);
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.nav-links a {
			color: var(--color-muted);
			font-size: 0.95rem;
			font-weight: 600;
			text-decoration: none;
		}

		.nav-links a:hover,
		.nav-links a:focus-visible {
			color: var(--color-accent);
		}

		.nav-button {
			padding: 11px 18px;
			border: 0;
			border-radius: 8px;
			background: var(--color-accent);
			color: var(--color-surface);
			font: inherit;
			font-weight: 700;
			text-decoration: none;
			white-space: nowrap;
		}

		.nav-button:hover,
		.nav-button:focus-visible {
			background: #2948bd;
		}

		@media (max-width: 640px) {
			.navbar {
				flex-wrap: wrap;
				padding: 16px 20px;
			}

			.navbar-right {
				width: 100%;
				justify-content: space-between;
				gap: 16px;
			}

			.nav-links {
				flex-wrap: wrap;
				gap: 12px 18px;
			}
		}
	</style>
</head>
<body>
	<nav class="navbar" aria-label="Main navigation">
		<a class="logo" href="#home">DevPath</a>
		<div class="navbar-right">
			<ul class="nav-links">
				<li><a href="#home">Home</a></li>
				<li><a href="#courses">Courses</a></li>
			
				<li><a href="#contact">Contact</a></li>
			</ul>
			<a class="nav-button" href="#sign Up">Sign Up</a>
		</div>
	</nav>
</body>
</html>
