<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard Grid</title>
	<style>
		:root {
			--color-page: #f3f6fb;
			--color-surface: #ffffff;
			--color-text: #1b2942;
			--color-muted: #63718a;
			--color-accent: #3859d7;
			--color-icon-users: #e8edff;
			--color-icon-sales: #e5f6ed;
			--color-icon-orders: #fff1d8;
			--color-icon-rating: #fce8ef;
			--color-icon-messages: #e5f3f7;
			--color-icon-done: #eee9ff;
			--space-page: 32px;
			--space-grid: 20px;
			--space-card: 24px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: var(--space-page);
			background: var(--color-page);
			color: var(--color-text);
			font-family: "Segoe UI", Arial, sans-serif;
		}

		main {
			display: grid;
			grid-template-columns: 220px minmax(0, 1fr);
			grid-template-areas:
				"head head"
				"side main"
				"foot foot";
			gap: var(--space-grid);
			width: min(100%, 1100px);
			margin: 0 auto;
		}

		header {
			grid-area: head;
			padding: 20px 24px;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		header h1 {
			margin: 0;
		}

		header p {
			margin: 8px 0 0;
			color: var(--color-muted);
		}

		.dashboard-grid {
			grid-area: main;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			gap: var(--space-grid);
		}

		.sidebar {
			grid-area: side;
			padding: 24px 18px;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		.sidebar h2 {
			margin: 0 0 16px;
			font-size: 1.1rem;
		}

		.sidebar ul {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.sidebar li + li {
			margin-top: 12px;
		}

		.sidebar a {
			color: var(--color-muted);
			text-decoration: none;
		}

		.sidebar a:hover,
		.sidebar a:focus-visible {
			color: var(--color-accent);
		}

		footer {
			grid-area: foot;
			padding: 16px;
			color: var(--color-muted);
			text-align: center;
		}

		.dashboard-card {
			display: flex;
			align-items: center;
			gap: 16px;
			min-height: 170px;
			padding: var(--space-card);
			border: 1px solid #e0e6f0;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		.card-icon {
			display: grid;
			width: 52px;
			min-width: 52px;
			aspect-ratio: 1;
			place-items: center;
			border-radius: 14px;
			color: var(--color-accent);
			font-size: 1.4rem;
			font-weight: 700;
		}

		.card-icon--users { background: var(--color-icon-users); }
		.card-icon--sales { background: var(--color-icon-sales); }
		.card-icon--orders { background: var(--color-icon-orders); }
		.card-icon--rating { background: var(--color-icon-rating); }
		.card-icon--messages { background: var(--color-icon-messages); }
		.card-icon--done { background: var(--color-icon-done); }

		.card-content {
			min-width: 0;
		}

		.dashboard-card h2 {
			margin: 0 0 8px;
			color: var(--color-accent);
			font-size: 1.1rem;
		}

		.metric {
			margin: 0;
			font-size: 2rem;
			font-weight: 700;
		}

		.card-note {
			margin: 8px 0 0;
			color: var(--color-muted);
		}

		@media (max-width: 760px) {
			:root {
				--space-page: 20px;
			}

			main {
				grid-template-columns: 1fr;
				grid-template-areas:
					"head"
					"side"
					"main"
					"foot";
			}

			.sidebar ul {
				display: flex;
				flex-wrap: wrap;
				gap: 12px 20px;
			}

			.sidebar li + li {
				margin-top: 0;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>My Dashboard</h1>
			<p>Overview of your activity and performance.</p>
		</header>
		<aside class="sidebar" aria-label="Dashboard navigation">
			<h2>Menu</h2>
			<ul>
				<li><a href="#overview">Overview</a></li>
				<li><a href="#reports">Reports</a></li>
				<li><a href="#settings">Settings</a></li>
			</ul>
		</aside>
		<section class="dashboard-grid" aria-label="Dashboard overview">
			<article class="dashboard-card">
				<span class="card-icon card-icon--users" aria-hidden="true">U</span>
				<div class="card-content">
					<h2>Users</h2>
					<p class="metric">120</p>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon card-icon--sales" aria-hidden="true">$</span>
				<div class="card-content">
					<h2>Sales</h2>
					<p class="metric">Rs 15k</p>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon card-icon--orders" aria-hidden="true">O</span>
				<div class="card-content">
					<h2>Orders</h2>
					<p class="metric">36</p>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon card-icon--rating" aria-hidden="true">★</span>
				<div class="card-content">
					<h2>Rating</h2>
					<p class="metric">4.8</p>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon card-icon--messages" aria-hidden="true">M</span>
				<div class="card-content">
					<h2>Messages</h2>
					<p class="metric">18</p>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon card-icon--done" aria-hidden="true">✓</span>
				<div class="card-content">
					<h2>Done</h2>
					<p class="metric">92%</p>
				</div>
			</article>
		</section>
		<footer>Dashboard summary</footer>
	</main>
</body>
</html>
