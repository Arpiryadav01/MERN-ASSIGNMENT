<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard Grid</title>
	<style>
		:root {
			--color-page: #ffffff;
			--color-stage: #edf2f8;
			--color-chrome: #e7ecf4;
			--color-surface: #ffffff;
			--color-text: #1b2942;
			--color-muted: #63718a;
			--color-accent: #3859d7;
			--color-dark: #12213d;
			--color-sidebar: #dce6fa;
			--color-frame-border: #dce3ee;
			--space-page: 18px;
			--space-stage: 10px;
			--space-grid: 12px;
			--space-card: 14px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: var(--space-page);
			background: var(--color-page);
			color: var(--color-text);
			font-family: "Segoe UI", Arial, sans-serif;
		}

		.output-label {
			margin: 0 0 4px;
			padding-left: 12px;
			border-left: 5px solid #ff633b;
			color: #0876ff;
			font-weight: 700;
		}

		.browser-frame {
			padding: var(--space-stage);
			border: 1px solid var(--color-frame-border);
			background: var(--color-stage);
		}

		.browser-chrome {
			display: flex;
			height: 40px;
			align-items: center;
			gap: 7px;
			padding: 0 16px;
			background: var(--color-chrome);
		}

		.browser-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
		}

		.browser-dot--red { background: #ff5f57; }
		.browser-dot--yellow { background: #febc2e; }
		.browser-dot--green { background: #28c840; }

		main {
			display: grid;
			grid-template-columns: 177px minmax(0, 1fr);
			grid-template-areas:
				"head head"
				"side main"
				"foot foot";
			gap: 10px;
			width: min(100%, 1100px);
			margin: 0 auto;
			padding-top: 10px;
		}

		header {
			grid-area: head;
			min-height: 140px;
			padding: 14px;
			border-radius: 9px;
			background: var(--color-dark);
			color: var(--color-surface);
		}

		header h1 {
			margin: 0;
		}

		header p {
			margin: 8px 0 0;
			color: var(--color-muted);
		}

		.dashboard-grid {
			grid-area: main;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
			gap: var(--space-grid);
			align-content: start;
		}

		.sidebar {
			grid-area: side;
			min-height: 235px;
			padding: 14px;
			border-radius: 9px;
			background: var(--color-sidebar);
		}

		.sidebar h2 {
			margin: 0 0 16px;
			font-size: 1.1rem;
		}

		.sidebar ul {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.sidebar li + li {
			margin-top: 12px;
		}

		.sidebar a {
			color: var(--color-muted);
			text-decoration: none;
		}

		.sidebar a:hover,
		.sidebar a:focus-visible {
			color: var(--color-accent);
		}

		footer {
			grid-area: foot;
			min-height: 125px;
			padding: 14px;
			border-radius: 9px;
			background: var(--color-dark);
			color: var(--color-surface);
			text-align: center;
		}

		.dashboard-card {
			display: flex;
			align-items: center;
			gap: 12px;
			min-height: 72px;
			padding: var(--space-card);
			border: 0;
			border-radius: 12px;
			background: var(--color-surface);
		}

		.card-icon {
			flex: 0 0 36px;
			font-size: 1.8rem;
			line-height: 1;
		}

		.card-content {
			min-width: 0;
		}

		.dashboard-card h2 {
			margin: 0;
			color: var(--color-text);
			font-size: 1rem;
			font-weight: 400;
			line-height: 1.15;
		}

		.metric {
			margin: 0;
			font-size: 1rem;
			font-weight: 700;
			line-height: 1.15;
		}

		@media (max-width: 760px) {
			:root {
				--space-page: 20px;
			}

			main {
				grid-template-columns: 1fr;
				grid-template-areas:
					"head"
					"side"
					"main"
					"foot";
			}

			header {
				min-height: 120px;
			}

			.sidebar {
				min-height: auto;
			}

			footer {
				min-height: 90px;
			}

			.sidebar ul {
				display: flex;
				flex-wrap: wrap;
				gap: 12px 20px;
			}

			.sidebar li + li {
				margin-top: 0;
			}
		}
	</style>
</head>
<body>
	<p class="output-label">EXPECTED OUTPUT (BROWSER)</p>
	<div class="browser-frame">
		<div class="browser-chrome" aria-hidden="true">
			<span class="browser-dot browser-dot--red"></span>
			<span class="browser-dot browser-dot--yellow"></span>
			<span class="browser-dot browser-dot--green"></span>
		</div>
		<main>
			<header>
			<h1>My Dashboard</h1>
			</header>
			<aside class="sidebar" aria-label="Dashboard navigation">
			<h2>Menu</h2>
			<ul>
				<li><a href="#overview">Overview</a></li>
				<li><a href="#reports">Reports</a></li>
				<li><a href="#settings">Settings</a></li>
			</ul>
			</aside>
			<section class="dashboard-grid" aria-label="Dashboard overview">
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">👤</span>
				<div class="card-content">
					<p class="metric">120</p>
					<h2>Users</h2>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">💰</span>
				<div class="card-content">
					<p class="metric">Rs 15k</p>
					<h2>Sales</h2>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">📦</span>
				<div class="card-content">
					<p class="metric">36</p>
					<h2>Orders</h2>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">⭐</span>
				<div class="card-content">
					<p class="metric">4.8</p>
					<h2>Rating</h2>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">💬</span>
				<div class="card-content">
					<p class="metric">18</p>
					<h2>Messages</h2>
				</div>
			</article>
			<article class="dashboard-card">
				<span class="card-icon" aria-hidden="true">✅</span>
				<div class="card-content">
					<p class="metric">92%</p>
					<h2>Done</h2>
				</div>
			</article>
			</section>
			<footer>Made with CSS Grid</footer>
		</main>
	</div>
</body>
</html>
