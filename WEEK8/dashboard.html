<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard Grid</title>
	<style>
		:root {
			--color-page: #f3f6fb;
			--color-surface: #ffffff;
			--color-text: #1b2942;
			--color-muted: #63718a;
			--color-accent: #3859d7;
			--space-page: 32px;
			--space-grid: 20px;
			--space-card: 24px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: var(--space-page);
			background: var(--color-page);
			color: var(--color-text);
			font-family: "Segoe UI", Arial, sans-serif;
		}

		main {
			display: grid;
			grid-template-columns: 220px minmax(0, 1fr);
			grid-template-areas:
				"head head"
				"side main"
				"foot foot";
			gap: var(--space-grid);
			width: min(100%, 1100px);
			margin: 0 auto;
		}

		header {
			grid-area: head;
			padding: 20px 24px;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		header h1 {
			margin: 0;
		}

		header p {
			margin: 8px 0 0;
			color: var(--color-muted);
		}

		.dashboard-grid {
			grid-area: main;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			gap: var(--space-grid);
		}

		.sidebar {
			grid-area: side;
			padding: 24px 18px;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		.sidebar h2 {
			margin: 0 0 16px;
			font-size: 1.1rem;
		}

		.sidebar ul {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.sidebar li + li {
			margin-top: 12px;
		}

		.sidebar a {
			color: var(--color-muted);
			text-decoration: none;
		}

		.sidebar a:hover,
		.sidebar a:focus-visible {
			color: var(--color-accent);
		}

		footer {
			grid-area: foot;
			padding: 16px;
			color: var(--color-muted);
			text-align: center;
		}

		.dashboard-card {
			min-height: 170px;
			padding: var(--space-card);
			border: 1px solid #e0e6f0;
			border-radius: 14px;
			background: var(--color-surface);
			box-shadow: 0 8px 24px rgb(27 41 66 / 6%);
		}

		.dashboard-card h2 {
			margin: 0 0 12px;
			color: var(--color-accent);
			font-size: 1.1rem;
		}

		.metric {
			margin: 0;
			font-size: 2rem;
			font-weight: 700;
		}

		.card-note {
			margin: 8px 0 0;
			color: var(--color-muted);
		}

		@media (max-width: 760px) {
			:root {
				--space-page: 20px;
			}

			main {
				grid-template-columns: 1fr;
				grid-template-areas:
					"head"
					"side"
					"main"
					"foot";
			}

			.sidebar ul {
				display: flex;
				flex-wrap: wrap;
				gap: 12px 20px;
			}

			.sidebar li + li {
				margin-top: 0;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>My Dashboard</h1>
			<p>Overview of your activity and performance.</p>
		</header>
		<aside class="sidebar" aria-label="Dashboard navigation">
			<h2>Menu</h2>
			<ul>
				<li><a href="#overview">Overview</a></li>
				<li><a href="#reports">Reports</a></li>
				<li><a href="#settings">Settings</a></li>
			</ul>
		</aside>
		<section class="dashboard-grid" aria-label="Dashboard overview">
			<article class="dashboard-card">
				
				<p class="metric">120</p>
				<p class="card-note">Users</p>
			</article>
			<article class="dashboard-card">
		
				<p class="metric"> Rs 15 k</p>
				<p class="card-note">Sales</p>
			</article>
			<article class="dashboard-card">
				
				<p class="metric">36</p>
				<p class="card-note">Orders</p>
			</article>
			<article class="dashboard-card">
			
				<p class="metric">4.8</p>
				<p class="card-note">Rating</p>
			</article>
			<article class="dashboard-card">

				<p class="metric">18</p>
				<p class="card-note">Messages</p>
			</article>
			<article class="dashboard-card">
				
				<p class="metric">92%</p>
				<p class="card-note">Done</p>
			</article>
		</section>
		<footer>Dashboard summary</footer>
	</main>
</body>
</html>
