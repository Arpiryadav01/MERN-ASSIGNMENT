<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Selector Types</title>
	<style>
		/* 1. Universal selector: applies to every element */
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 40px 20px;
			background: #c3c4c3;
			color: #757a77;
			font-family: Arial, sans-serif;
		}

		/* 2. Element selector: applies to every h1 */
		h1 {
			color: #2c2c2c;
			text-align: center;
		}

		/* 3. Class selector: applies to elements with class="card" */
		.card {
			max-width: 520px;
			margin: 24px auto;
			padding: 24px;
			border: 1px solid #777671;
			border-radius: 12px;
			background: rgb(210, 243, 199);
			box-shadow: 0 8px 24px rgb(24 58 43 / 10%);
		}

		/* 4. ID selector: applies to the element with id="hero" */
		#hero {
			color: #242525;
			font-size: 2rem;
		}
	</style>
</head>
<body>
	<h1 id="hero">About me</h1>
	<section class="card">
		<h1>Arpit Yadav</h1>
		<p>My name is Arpit yadav ,my course Btech cse ,my student <strong>id</strong> BCS2026343 . i am from lakhmpur kheri and 
         my 10 and 12 is completed from cbse board school.
	</section>
</body>
</html>
