<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Form</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--color-text: #183a2b;
			--color-page: #f3f7f4;
			--color-border: #d5e0d8;
			--color-card: #fff;
			--color-primary: #287348;
			--color-input-border: #b8c9bd;
			--color-focus: #b8e3c2;
			--color-reset: #e2ebe5;
			--color-white: #fff;
			--space-page-y: 32px;
			--space-page-x: 20px;
			--space-card: 28px;
			--space-heading-bottom: 20px;
			--space-paragraph-bottom: 16px;
			--space-label-bottom: 5px;
			--space-control-y: 11px;
			--space-control-x: 12px;
			--space-textarea-min-height: 120px;
			--space-button-y: 10px;
			--space-button-x: 18px;
			--space-button-margin-y: 4px;
			--space-button-margin-right: 8px;
			--space-mobile-page-y: 16px;
			--space-mobile-page-x: 12px;
			--space-mobile-card: 20px;

			font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
			font-size: 16px;
			line-height: 1.6;
			color: var(--color-text);
			background: var(--color-page);
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: var(--space-page-y) var(--space-page-x);
			display: grid;
			place-items: start center;
			line-height: 1.6;
		}

		form {
			width: min(100%, 560px);
			padding: var(--space-card);
			border: 1px solid var(--color-border);
			border-radius: 14px;
			background: var(--color-card);
			box-shadow: 0 12px 32px rgb(24 58 43 / 9%);
		}

		.card {
			border-top: 5px solid var(--color-primary);
		}

		h1 {
			margin: 0 0 var(--space-heading-bottom);
			color: var(--color-text);
			font-size: clamp(1.6rem, 4vw, 2rem);
		}

		#hero {
			letter-spacing: 0.02em;
		}

		p {
			margin: 0 0 var(--space-paragraph-bottom);
		}

		label {
			display: inline-block;
			margin-bottom: var(--space-label-bottom);
			font-weight: 600;
		}

		input:not([type="radio"]):not([type="checkbox"]),
		select,
		textarea {
			display: block;
			width: 100%;
			padding: var(--space-control-y) var(--space-control-x);
			border: 1px solid var(--color-input-border);
			border-radius: 7px;
			background: var(--color-card);
			color: var(--color-text);
			font: inherit;
		}

		input[type="radio"],
		input[type="checkbox"] {
			accent-color: var(--color-primary);
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: 3px solid var(--color-focus);
			border-color: var(--color-primary);
		}

		textarea {
			min-height: var(--space-textarea-min-height);
			resize: vertical;
		}

		button {
			margin: var(--space-button-margin-y) var(--space-button-margin-right) var(--space-button-margin-y) 0;
			padding: var(--space-button-y) var(--space-button-x);
			border: 0;
			border-radius: 7px;
			background: var(--color-primary);
			color: var(--color-white);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button[type="reset"] {
			background: var(--color-reset);
			color: var(--color-text);
		}

		button:hover {
			filter: brightness(0.92);
		}

		@media (max-width: 480px) {
			body {
				padding: var(--space-mobile-page-y) var(--space-mobile-page-x);
			}

			form {
				padding: var(--space-mobile-card);
			}
		}
	</style>
</head>
<body>
	<form class="card">
		<h1 id="hero">Get in touch</h1>
		<p>Fill out the form and we’ll get back to you.</p>

		<p>
			<label for="name">Name</label>
			<input id="name" name="name" type="text" autocomplete="name" required>
		</p>
		<p>
			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" required>
		</p>
		<p>
			<label for="message">Message</label>
			<textarea id="message" name="message" required></textarea>
		</p>

		<button type="submit">Send message</button>
		<button type="reset">Clear</button>
	</form>
</body>
</html>
